<svg viewBox="0 0 960 664" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .title{fill:#0f172a;font-size:24px;font-weight:700}
      .sub{fill:#64748b;font-size:13.5px}
      .kicker{fill:#0d9488;font-size:12px;font-weight:700;letter-spacing:1.4px}
      .axis{stroke:#0f172a;stroke-width:1.5}
      .zero{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:2 4}
      .divider{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:4 5}
      .axlab{fill:#334155;font-size:13px;font-weight:600}
      .axhint{fill:#94a3b8;font-size:11.5px;font-weight:600}
      .qsweet{fill:#eafaf7;stroke:#99f6e4;stroke-width:1}
      .qess{fill:#fef2f4;stroke:#fecdd3;stroke-width:1}
      .qsweett{fill:#0f766e;font-size:13px;font-weight:750;letter-spacing:.5px}
      .qesst{fill:#e11d48;font-size:13px;font-weight:750;letter-spacing:.5px}
      .qsub{fill:#64748b;font-size:11px}
      .dotb{fill:#0d9488}
      .dote{fill:#e11d48}
      .dotn{fill:#cbd5e1}
      .lblb{fill:#0f766e;font-size:12px;font-weight:650}
      .lble{fill:#be123c;font-size:12px;font-weight:650}
      .legt{fill:#475569;font-size:11.5px;font-weight:600}
      .band{fill:#0f172a}
      .bandt{fill:#e2e8f0;font-size:12px}
      .bandm{fill:#94a3b8;font-size:11px}
      .bandh{fill:#5eead4;font-size:11px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="664"/>

  <text class="kicker" x="52" y="40">METHOD · THE DIFFERENTIATOR</text>
  <text class="title" x="52" y="70">Effect size × direction: druggable brakes vs essential machinery</text>
  <text class="sub" x="52" y="94">Ranking by causal magnitude alone promotes undruggable core machinery. A signed effector-vs-exhaustion axis surfaces the real targets.</text>

  <!-- legend -->
  <g>
    <circle class="dotb" cx="512" cy="36" r="5"/><text class="legt" x="524" y="40">brake (druggable)</text>
    <circle class="dote" cx="652" cy="36" r="5"/><text class="legt" x="664" y="40">essential (undruggable)</text>
    <circle class="dotn" cx="812" cy="36" r="5"/><text class="legt" x="824" y="40">neutral / low effect</text>
  </g>

  <!-- quadrant backgrounds -->
  <rect class="qsweet" x="470" y="150" width="342" height="160"/>
  <rect class="qess" x="470" y="310" width="342" height="160"/>

  <!-- axes -->
  <line class="axis" x1="150" y1="470" x2="812" y2="470"/>
  <line class="axis" x1="150" y1="150" x2="150" y2="470"/>
  <line class="zero" x1="150" y1="310" x2="812" y2="310"/>
  <line class="divider" x1="470" y1="150" x2="470" y2="470"/>

  <!-- axis labels -->
  <text class="axlab" x="482" y="502">Causal effect size  (power-equalized E-distance)   →</text>
  <text class="axhint" x="196" y="502">low effect</text>
  <g transform="rotate(-90 42 310)">
    <text class="axlab" x="42" y="310" text-anchor="middle">Direction score  (cytotoxic − exhaustion)</text>
  </g>
  <text class="axhint" x="160" y="170">brake ↑</text>
  <text class="axhint" x="160" y="462">required ↓</text>

  <!-- quadrant tags (placed in the dot-free left region) -->
  <text class="qsweett" x="482" y="184">DRUGGABLE BRAKES</text>
  <text class="qsub" x="482" y="202">removing them boosts effector function → inhibit</text>
  <text class="qesst" x="482" y="338">ESSENTIAL MACHINERY</text>
  <text class="qsub" x="482" y="356">largest effect, but undruggable</text>

  <!-- neutral cloud -->
  <g class="dotn">
    <circle cx="212" cy="300" r="3.6"/><circle cx="242" cy="322" r="3.6"/><circle cx="270" cy="292" r="3.6"/>
    <circle cx="300" cy="330" r="3.6"/><circle cx="332" cy="300" r="3.6"/><circle cx="356" cy="286" r="3.6"/>
    <circle cx="286" cy="308" r="3.6"/><circle cx="226" cy="284" r="3.6"/><circle cx="320" cy="324" r="3.6"/>
    <circle cx="384" cy="312" r="3.6"/><circle cx="258" cy="336" r="3.6"/>
  </g>

  <!-- brakes (sweet spot, upper-right) -->
  <g>
    <circle class="dotb" cx="762" cy="206" r="6"/><text class="lblb" x="752" y="210" text-anchor="end">CBLB</text>
    <circle class="dotb" cx="700" cy="230" r="5.5"/><text class="lblb" x="690" y="234" text-anchor="end">RASA2</text>
    <circle class="dotb" cx="648" cy="250" r="5"/><text class="lblb" x="638" y="254" text-anchor="end">SOCS1</text>
    <circle class="dotb" cx="726" cy="190" r="5"/><text class="lblb" x="736" y="186">CBL</text>
  </g>

  <!-- essential machinery (lower-right) -->
  <g>
    <circle class="dote" cx="704" cy="382" r="6"/><text class="lble" x="714" y="379">ZAP70</text>
    <circle class="dote" cx="756" cy="414" r="6"/><text class="lble" x="766" y="418">CD3D</text>
    <circle class="dote" cx="665" cy="372" r="5.5"/><text class="lble" x="675" y="369">LAT</text>
    <circle class="dote" cx="720" cy="434" r="5.5"/><text class="lble" x="730" y="438">PLCG1</text>
    <circle class="dote" cx="618" cy="404" r="5"/><text class="lble" x="608" y="408" text-anchor="end">LCP2</text>
    <circle class="dote" cx="772" cy="372" r="5.5"/><text class="lble" x="782" y="369">VAV1</text>
  </g>

  <!-- caption band -->
  <rect class="band" x="52" y="534" width="856" height="104" rx="14"/>
  <text class="bandh" x="72" y="560">READ THIS FIGURE</text>
  <text class="bandt" x="72" y="582">The largest causal hits are essential TCR machinery (ZAP70, CD3D, LAT) — removing them cripples the cell, so they are undruggable.</text>
  <text class="bandt" x="72" y="602">The direction axis surfaces the brakes (CBLB, RASA2) whose removal boosts effector function — the druggable quadrant.</text>
  <text class="bandm" x="72" y="623" font-style="italic">Schematic: positions illustrative; real direction_score comes from the Claude Science --direction re-run. IL2RB is nominated via the network step.</text>
</svg>
