   <g id="text_2">
    <text style="fill: #d97a12; font: 700 11px 'DejaVu Sans'; text-anchor: middle" x="692.818951" y="354.795467" transform="rotate(-0 692.818951 354.795467)">RASGRP1</text>
   </g>
   <g id="text_3">
    <text style="fill: #8fa39d; font: 13px 'DejaVu Sans'" transform="translate(48.017321 146.570127)">Ranked by</text>
    <text style="fill: #8fa39d; font: 13px 'DejaVu Sans'" transform="translate(49.617946 161.127283)">effect size</text>
   </g>
   <g id="text_4">
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'" transform="translate(35.378883 290.062518)">+ direction</text>
    <text style="fill: #ffffff; font: 700 13px 'DejaVu Sans'" transform="translate(55.591852 304.619674)">(signed)</text>
   </g>
   <g id="text_5">
    <text style="fill: #8fa39d; font: 14.5px 'DejaVu Sans'; text-anchor: middle" x="494.424" y="88.059476" transform="rotate(-0 494.424 88.059476)">The top 20 knockdowns look interchangeable —</text>
   </g>
   <g id="text_6">
    <text style="fill: #0d9488; font: 700 14.5px 'DejaVu Sans'; text-anchor: middle" x="494.424" y="217.248331" transform="rotate(-0 494.424 217.248331)">but 18 of 20 are the cell's own essential machinery (teal), not drug targets.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="fill: #ffffff; font: 700 20px 'DejaVu Sans'; text-anchor: middle" x="453.6" y="24.700875" transform="rotate(-0 453.6 24.700875)">Why the signed axis matters</text>
  </g>
  <g id="text_8">
   <text style="fill: #8fa39d; font: 12.5px 'DejaVu Sans'; text-anchor: middle" x="453.6" y="449.064" transform="rotate(-0 453.6 449.064)">Effect size alone can't tell a drug target from machinery a T cell needs to survive. The signed direction axis can — and surfaces the candidate brakes.</text>
  </g>
 </g>
