<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .grid{stroke:#eef2f7;stroke-width:1}
      .title{fill:#0f172a;font-size:25px;font-weight:700}
      .sub{fill:#64748b;font-size:13.5px}
      .card{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1.5}
      .clabel{fill:#0f172a;font-size:15.5px;font-weight:650}
      .cmeta{fill:#475569;font-size:12px}
      .hero{fill:#0d9488}
      .herot{fill:#ffffff;font-size:30px;font-weight:750;letter-spacing:.5px}
      .heros{fill:#ccfbf1;font-size:12.5px;font-weight:600;letter-spacing:.3px}
      .arrow{stroke:#0d9488;stroke-width:2;fill:none;opacity:.5}
      .kicker{fill:#0d9488;font-size:12px;font-weight:700;letter-spacing:1.4px}
      .band{fill:#0f172a}
      .bandt{fill:#e2e8f0;font-size:12.5px}
      .bandh{fill:#5eead4;font-size:11.5px;font-weight:700;letter-spacing:1px}
      .amber{fill:#fbbf24;font-weight:700}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="660"/>
  <g class="grid">
    <line x1="0" y1="132" x2="960" y2="132"/><line x1="0" y1="264" x2="960" y2="264"/>
    <line x1="0" y1="396" x2="960" y2="396"/><line x1="240" y1="0" x2="240" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/><line x1="720" y1="0" x2="720" y2="560"/>
  </g>

  <text class="kicker" x="52" y="42">GENOME-SCALE · 2.44M CD4⁺ T CELLS · 12,449 PERTURBATIONS</text>
  <text class="title" x="52" y="72">The nominated target: IL2RB — the IL-2 signaling axis</text>
  <text class="sub" x="52" y="96">Network-nominated from a genome-scale CRISPRi screen. Causal validation, human genetics, and druggability converge.</text>

  <path class="arrow" d="M300,205 C360,235 400,255 430,285"/>
  <path class="arrow" d="M660,205 C600,235 560,255 530,285"/>
  <path class="arrow" d="M300,470 C360,430 400,405 430,372"/>
  <path class="arrow" d="M660,470 C600,430 560,405 530,372"/>

  <rect class="hero" x="360" y="284" width="240" height="96" rx="16"/>
  <text class="herot" x="480" y="326" text-anchor="middle">IL2RB</text>
  <text class="heros" x="480" y="352" text-anchor="middle">IL-2 · IL-15 receptor β  (CD122)</text>

  <g>
    <rect class="card" x="52" y="128" width="248" height="92" rx="14"/>
    <text class="clabel" x="70" y="158">① Network-central</text>
    <text class="cmeta" x="70" y="180">Diffuses from 5 causal hits — CD247,</text>
    <text class="cmeta" x="70" y="198">STAT3, ITK, PTPRC, CD3D. Not a direct hit.</text>
  </g>
  <g>
    <rect class="card" x="660" y="128" width="248" height="92" rx="14"/>
    <text class="clabel" x="678" y="158">② Human genetics</text>
    <text class="cmeta" x="678" y="180">Multiple sclerosis, autoimmunity</text>
    <text class="cmeta" x="678" y="198">(Open Targets) — autoimmune-relevant.</text>
  </g>
  <g>
    <rect class="card" x="52" y="440" width="248" height="92" rx="14"/>
    <text class="clabel" x="70" y="470">③ Causal validation</text>
    <text class="cmeta" x="70" y="492">The screen recovers the full TCR module</text>
    <text class="cmeta" x="70" y="510">from 2.44M cells — the method works.</text>
  </g>
  <g>
    <rect class="card" x="660" y="440" width="248" height="92" rx="14"/>
    <text class="clabel" x="678" y="470">④ Druggability (adjacent)</text>
    <text class="cmeta" x="678" y="492">IL-2-pathway agonists — aldesleukin;</text>
    <text class="cmeta" x="678" y="510">CD122-biased agents in trials.</text>
  </g>

  <rect class="band" x="52" y="576" width="856" height="60" rx="14"/>
  <text class="bandh" x="72" y="600">VALIDATION</text>
  <text class="bandt" x="72" y="620">Top causal hits are the entire TCR module: ZAP70, CD3D/E/G, PLCG1, LAT, VAV1, RASGRP1, ITK.</text>
  <text class="bandt" x="648" y="600">Novel frontier</text>
  <text class="bandt" x="648" y="620"><tspan class="amber">VAV2 · BLNK</tspan> — genuinely undrugged.</text>
</svg>
