name: tcell-perturb
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scanpy=1.10
  - anndata=0.10
  - scikit-learn=1.5
  - python-igraph
  - leidenalg
  - pip
  - pip:
      - pertpy==0.9.*        # mixscape, E-distance/E-test, augur
      - scperturb            # harmonized E-statistics helpers
      - pydeseq2==0.4.*      # pseudobulk differential expression
      - decoupler            # pseudobulk aggregation
# Reproducibility: pin exact builds with `conda env export --no-builds > lock.yml` on first run.
